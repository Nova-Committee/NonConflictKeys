pluginManagement {
    // Machine-local paths are generated by setup; explicit -P overrides take precedence.
    def localFile = file('gradle.local.properties')
    if (localFile.isFile()) {
        def local = new Properties()
        localFile.withInputStream { local.load(it) }
        gradle.startParameter.projectProperties = local.collectEntries { key, value ->
            [(key.toString()): value.toString()]
        } + gradle.startParameter.projectProperties
    }
    repositories {
        maven {
            url = uri(providers.gradleProperty('retrospectumMavenUrl').getOrElse('https://maven.desiderium.dev/releases/'))
            content { includeGroup 'dev.desiderium.retro'; includeGroup 'dev.desiderium.retro.loom' }
        }
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'dev.desiderium.retro.loom' version providers.gradleProperty('loom_version').getOrElse('0.2.1')
    }
    def checkout = providers.gradleProperty('retrospectumLoomCheckout').orNull
    if (checkout) includeBuild(checkout)
}
rootProject.name = 'NonConflictKeys1.6.4'
